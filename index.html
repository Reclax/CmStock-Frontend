<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
        rel="stylesheet" />
    <meta name="theme-color" content="#1B4965" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      #initial-loader {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #1b3d8f;
        font-family: 'Manrope', sans-serif;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 1.5rem;
        text-align: center;
      }
      .loader-img {
        margin-bottom: 3.5rem;
        width: min(220px, 52vw);
        max-width: 100%;
        user-select: none;
      }
      .loader-dots {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .loader-dot {
        height: 10px;
        width: 10px;
        border-radius: 9999px;
        background-color: #1a2f8a;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      .loader-text {
        margin-top: 1rem;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        color: #94a3b8;
      }
    </style>
</head>

<body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-content">
          <img src="/image.png" alt="CM Stock" class="loader-img" />
          <div class="loader-dots" aria-hidden="true">
            <span class="loader-dot" style="animation-delay: 0ms"></span>
            <span class="loader-dot" style="animation-delay: 180ms"></span>
            <span class="loader-dot" style="animation-delay: 360ms"></span>
          </div>
          <p class="loader-text">Cargando aplicación...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
